<div class="action-btns">
    <button type="button" (click)="removeAllProducts()">Remove all</button>
    <button type="button" (click)="addProduct()">Add product</button>
    <button type="button" (click)="resetProductList()">Rest product list</button>
</div>
<div class="list-label">Categories</div>
<div class="filter-block">
    <label *ngFor="let type of productTypes" [attr.for]="type.code">
        <input #radio
        [attr.id]="type.code"
        type="radio"
        name="product_type"
        [value]="type.code"
        (change)="onFilterValueChange(radio.value)">
        {{ type.label }}
    </label>
</div>
<div class="list-label">List of products :</div>
<app-product-item (delete)="onDelete($event)" *ngFor="let product of filteredList()" [product]="product" />
<div class="summary">
    <strong>Count :</strong>
    {{ products().length }}
</div>
